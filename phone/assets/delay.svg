<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="delayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#delayGrad)" />
  <!-- Minimalist Analog Clock & Delay Hand -->
  <circle cx="100" cy="100" r="64" fill="#ffffff" />
  <circle cx="100" cy="100" r="54" fill="#fff7ed" />
  <!-- Hour and Minute hands showing time postponement -->
  <line x1="100" y1="100" x2="100" y2="62" stroke="#ea580c" stroke-width="8" stroke-linecap="round" />
  <line x1="100" y1="100" x2="132" y2="100" stroke="#ea580c" stroke-width="8" stroke-linecap="round" />
  <circle cx="100" cy="100" r="8" fill="#ea580c" />
  <!-- Circular Waiting Arrow Indicator -->
  <path d="M142 62 A 64 64 0 0 1 164 100" fill="none" stroke="#facc15" stroke-width="8" stroke-linecap="round" />
  <polygon points="164,106 172,92 156,92" fill="#facc15" />
</svg>
